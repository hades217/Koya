    <text x="42" y="91" fill="#292735" font-family="Iowan Old Style, Georgia, serif" font-size="34">Iris / Persimmon</text>
    <text x="42" y="123" fill="#6F6A66" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14">Distinctive, authored, contemporary. Colour carries identity; ink stays softly violet.</text>

