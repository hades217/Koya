<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Estate Studio professional palette research v3</title>
  <desc id="desc">Three non-green brand palette directions on warm neutral interfaces: Iris and Persimmon, Cobalt and Tangerine, and Mulberry and Apricot.</desc>
  <rect width="1440" height="1040" fill="#F2EEE6"/>

  <text x="72" y="76" fill="#292735" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500">Estate Studio · professional colour study</text>
  <text x="72" y="111" fill="#6F6A66" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">V3 · NO GREEN BRAND LAYER · WARM NEUTRAL FOUNDATION</text>
  <rect x="1150" y="54" width="218" height="44" rx="22" fill="#FFFDF9" stroke="#DED9D0"/>
  <circle cx="1180" cy="76" r="6" fill="#C83C3C"/>
  <text x="1198" y="81" fill="#6F403C" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">GREEN RETIRED</text>

  <!-- Candidate A -->
