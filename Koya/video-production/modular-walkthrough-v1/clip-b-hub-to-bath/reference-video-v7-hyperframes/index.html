<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #d9d0c2;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #d9d0c2;
      }
      #world-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 1920px;
        height: 1080px;
      }
      .vignette {
        position: absolute;
        inset: -4px;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, transparent 56%, rgba(45, 32, 23, 0.13) 100%);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-z7xn" id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div data-hf-id="hf-afb7" id="clip-b-reference" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <canvas data-hf-id="hf-hxmr" id="world-canvas" width="1920" height="1080" aria-label="Apartment 106 deterministic Clip B camera reference"></canvas>
        <div data-hf-id="hf-werf" id="light-field" class="vignette"></div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("world-canvas");
      const gl = canvas.getContext("webgl", { antialias: true, alpha: false, preserveDrawingBuffer: true });
      if (!gl) throw new Error("WebGL is required for the deterministic reference scene");

      const vertexSource = `
        attribute vec3 aPosition;
        attribute vec3 aColor;
        uniform mat4 uViewProjection;
        varying vec3 vColor;
        varying float vDepth;
        void main() {
          vec4 clip = uViewProjection * vec4(aPosition, 1.0);
          gl_Position = clip;
          vColor = aColor;
          vDepth = clip.z / clip.w;
        }
      `;
      const fragmentSource = `
        precision mediump float;
        varying vec3 vColor;
        varying float vDepth;
        void main() {
          float fog = smoothstep(0.78, 1.0, vDepth);
          vec3 daylight = vec3(0.83, 0.82, 0.78);
          gl_FragColor = vec4(mix(vColor, daylight, fog * 0.46), 1.0);
        }
      `;

      function shader(type, source) {
        const value = gl.createShader(type);
        gl.shaderSource(value, source);
        gl.compileShader(value);
        if (!gl.getShaderParameter(value, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(value));
        return value;
      }
      const program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      gl.useProgram(program);

      const vertices = [];
      const colors = [];
      const clampColor = (c, s) => c.map((v) => Math.max(0, Math.min(1, v * s)));
      function triangle(a, b, c, color) {
        vertices.push(...a, ...b, ...c);
        colors.push(...color, ...color, ...color);
      }
      function quad(a, b, c, d, color) {
        triangle(a, b, c, color);
        triangle(a, c, d, color);
      }
      function box(cx, cy, cz, sx, sy, sz, base) {
        const x0 = cx - sx / 2, x1 = cx + sx / 2;
        const y0 = cy - sy / 2, y1 = cy + sy / 2;
        const z0 = cz - sz / 2, z1 = cz + sz / 2;
        quad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],clampColor(base,0.92));
        quad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],clampColor(base,1.03));
        quad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],clampColor(base,0.82));
        quad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],clampColor(base,0.88));
        quad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],clampColor(base,1.12));
        quad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],clampColor(base,0.74));
      }

      const warmWall = [0.86, 0.83, 0.77];
      const whiteWall = [0.91, 0.89, 0.85];
      const oak = [0.56, 0.40, 0.27];
      const paleOak = [0.72, 0.59, 0.43];
      const stone = [0.74, 0.72, 0.67];
      const dark = [0.23, 0.19, 0.16];
      const tile = [0.66, 0.66, 0.63];
      const metal = [0.46, 0.48, 0.47];

      // Continuous apartment shell and floor.
      box(0.5, -0.06, 0.45, 13.0, 0.12, 6.0, paleOak);
      for (let z = -2.45; z <= 3.25; z += 0.24) box(0.5, 0.008, z, 13.0, 0.018, 0.018, [0.43,0.31,0.21]);
      box(0.5, 2.75, 0.45, 13.0, 0.08, 6.0, whiteWall);

      // Fixed kitchen on the north/right side during westward travel.
      box(1.75, 1.35, -0.05, 7.5, 2.7, 0.12, warmWall);
      box(1.65, 0.46, 0.26, 6.9, 0.92, 0.62, oak);
      box(1.65, 0.96, 0.47, 6.95, 0.09, 0.68, stone);
      for (let x = -1.55; x <= 4.8; x += 0.7) box(x, 0.47, 0.59, 0.035, 0.82, 0.025, dark);
      box(3.7, 1.75, 0.10, 2.3, 1.1, 0.42, paleOak);
      box(4.95, 1.15, 0.12, 0.82, 2.3, 0.50, paleOak);
      box(4.95, 1.35, 0.39, 0.58, 1.25, 0.04, [0.24,0.26,0.26]);

      // One fixed island on the south/left side of the first camera movement.
      box(1.70, 0.48, 2.18, 3.15, 0.96, 0.96, paleOak);
      box(1.70, 1.00, 2.18, 3.35, 0.10, 1.08, stone);
      box(1.25, 1.07, 2.02, 0.75, 0.035, 0.42, dark);
      box(2.05, 1.07, 2.02, 0.75, 0.035, 0.42, dark);

      // MPR stays a solid south/left wall after the island.
      box(-1.45, 1.35, 2.65, 3.35, 2.70, 0.14, warmWall);

      // Main Bath south wall with exactly one stable doorway.
      box(-3.88, 1.35, 0.02, 0.75, 2.70, 0.14, whiteWall);
      box(-2.26, 1.35, 0.02, 0.58, 2.70, 0.14, whiteWall);
      box(-3.48, 1.18, 0.02, 0.10, 2.36, 0.22, dark);
      box(-2.56, 1.18, 0.02, 0.10, 2.36, 0.22, dark);
      box(-3.02, 2.32, 0.02, 1.02, 0.11, 0.22, dark);

      // Compact Bath envelope; Laundry remains separated west of the left wall.
      box(-3.02, -0.035, -1.18, 2.0, 0.07, 2.35, tile);
      for (let x = -3.95; x <= -2.05; x += 0.34) box(x, 0.01, -1.18, 0.018, 0.022, 2.30, [0.43,0.44,0.42]);
      for (let z = -2.24; z <= -0.12; z += 0.34) box(-3.02, 0.012, z, 1.95, 0.022, 0.018, [0.43,0.44,0.42]);
      box(-3.02, 1.35, -2.34, 2.00, 2.70, 0.14, whiteWall);
      box(-4.04, 1.35, -1.17, 0.14, 2.70, 2.48, whiteWall);
      box(-2.00, 1.35, -1.17, 0.14, 2.70, 2.48, whiteWall);

      // Bath fixtures are fixed geometry.
      box(-3.52, 0.45, -2.02, 0.78, 0.88, 0.52, paleOak);
      box(-3.52, 0.94, -2.02, 0.88, 0.10, 0.58, stone);
      box(-3.52, 1.67, -2.25, 0.86, 1.10, 0.035, [0.52,0.58,0.58]);
      box(-3.52, 1.02, -1.89, 0.38, 0.08, 0.27, [0.90,0.90,0.86]);
      box(-2.47, 0.42, -1.79, 0.48, 0.56, 0.70, [0.88,0.87,0.82]);
      box(-2.47, 0.73, -1.93, 0.50, 0.12, 0.46, [0.92,0.91,0.87]);
      box(-2.25, 1.20, -0.72, 0.035, 2.05, 1.05, [0.58,0.64,0.64]);
      box(-2.28, 2.20, -0.72, 0.08, 0.06, 1.05, metal);

      // Stable ceiling lights and a living-side window glow, all daytime.
      for (const [x,z] of [[4.5,1.2],[2.6,1.2],[0.7,1.2],[-1.2,1.2],[-3.0,-0.9]]) {
        box(x, 2.68, z, 0.22, 0.025, 0.22, [1.0,0.95,0.80]);
      }
      box(6.42, 1.38, 1.15, 0.08, 2.60, 3.10, [0.64,0.76,0.80]);

      const vertexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
      const positionLocation = gl.getAttribLocation(program, "aPosition");
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);
      const colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
      const colorLocation = gl.getAttribLocation(program, "aColor");
      gl.enableVertexAttribArray(colorLocation);
      gl.vertexAttribPointer(colorLocation, 3, gl.FLOAT, false, 0, 0);
      const matrixLocation = gl.getUniformLocation(program, "uViewProjection");

      function perspective(fov, aspect, near, far) {
        const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
        return new Float32Array([
          f/aspect,0,0,0,
          0,f,0,0,
          0,0,(far+near)*nf,-1,
          0,0,2*far*near*nf,0
        ]);
      }
      function normalize(v) {
        const n = Math.hypot(v[0],v[1],v[2]) || 1;
        return [v[0]/n,v[1]/n,v[2]/n];
      }
      function cross(a,b) {
        return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
      }
      function lookAt(eye, target) {
        const z = normalize([eye[0]-target[0],eye[1]-target[1],eye[2]-target[2]]);
        const x = normalize(cross([0,1,0],z));
        const y = cross(z,x);
        return new Float32Array([
          x[0],y[0],z[0],0,
          x[1],y[1],z[1],0,
          x[2],y[2],z[2],0,
          -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
          -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
          -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1
        ]);
      }
      function multiply(a,b) {
        const out = new Float32Array(16);
        for (let c=0;c<4;c++) for (let r=0;r<4;r++) {
          out[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
        }
        return out;
      }
      const lerp = (a,b,t) => a + (b-a)*t;
      const smooth = (t) => t*t*(3-2*t);
      function segment(value, start, end) { return smooth(Math.max(0,Math.min(1,(value-start)/(end-start)))); }

      // About a 28 mm full-frame-equivalent rectilinear lens: 46 degree vertical FOV at 16:9.
      const projection = perspective(46 * Math.PI / 180, 1920/1080, 0.06, 30);
      function cameraAt(progress) {
        let x, z, yaw;
        if (progress < 0.08) {
          const s = segment(progress,0,0.08);
          x = lerp(5.45,4.30,s); z = lerp(1.28,1.20,s); yaw = -Math.PI/2;
        } else if (progress < 0.30) {
          const s = segment(progress,0.08,0.30);
          x = lerp(4.30,-1.70,s); z = lerp(1.20,1.30,s); yaw = lerp(-Math.PI/2,-1.31,s);
        } else if (progress < 0.52) {
          const s = segment(progress,0.30,0.52);
          x = lerp(-1.70,-3.02,s); z = lerp(1.30,0.55,s); yaw = lerp(-1.31,0,s);
        } else {
          const s = segment(progress,0.52,1.0);
          x = lerp(-3.02,-3.08,s); z = lerp(0.55,-0.62,s); yaw = lerp(0,-0.23,s);
        }
        const bob = 0.012 * Math.sin(progress * Math.PI * 4);
        const eye = [x,1.58+bob,z];
        const direction = [Math.sin(yaw),-0.018,-Math.cos(yaw)];
        const target = [x+direction[0]*2.4,1.52,z+direction[2]*2.4];
        return { eye, target };
      }
      function draw(progress) {
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.clearColor(0.83,0.82,0.78,1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        const camera = cameraAt(progress);
        gl.uniformMatrix4fv(matrixLocation,false,multiply(projection,lookAt(camera.eye,camera.target)));
        gl.drawArrays(gl.TRIANGLES,0,vertices.length/3);
      }

      const state = { progress: 0 };
      draw(0);
      const timeline = gsap.timeline({ paused: true });
      timeline.to(state, { progress: 1, duration: 5, ease: "none", onUpdate: () => draw(state.progress) }, 0);
      timeline.fromTo("#light-field", { x: -2 }, { x: 2, duration: 5, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines.main = timeline;
    </script>
  </body>
