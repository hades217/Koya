<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apartment 106 Clip B Blockout</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e5df}
    canvas{display:block;width:100%;height:100%}
    #tag{position:fixed;left:24px;top:20px;padding:10px 15px;border-radius:8px;background:rgba(20,24,28,.78);color:#fff;font:700 24px/1.2 Arial,sans-serif;letter-spacing:.04em}
  </style>
</head>
<body>
  <div id="tag"></div>
  <script type="module">
    import * as THREE from './three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8e5df);
    scene.fog = new THREE.Fog(0xe8e5df, 16, 30);

    const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = .82;
    document.body.appendChild(renderer.domElement);

    const wallMat = new THREE.MeshStandardMaterial({color:0xf2f0eb,roughness:.9});
    const floorMat = new THREE.MeshStandardMaterial({color:0xc9ad88,roughness:.82});
    const tileMat = new THREE.MeshStandardMaterial({color:0xd9d6cf,roughness:.78});
    const cabinetMat = new THREE.MeshStandardMaterial({color:0xb79773,roughness:.72});
    const stoneMat = new THREE.MeshStandardMaterial({color:0xdedbd3,roughness:.52});
    const glassMat = new THREE.MeshPhysicalMaterial({color:0xbfd3d8,transparent:true,opacity:.28,roughness:.1});
    const darkMat = new THREE.MeshStandardMaterial({color:0x3b3b38,roughness:.55});

    function box(x,y,z,w,h,d,mat=wallMat){
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); return mesh;
    }
    function wallX(x1,x2,z){ box((x1+x2)/2,1.35,z,x2-x1,2.7,.12); }
    function wallZ(x,z1,z2){ box(x,1.35,(z1+z2)/2,.12,2.7,z2-z1); }

    // Floor: timber circulation/public zone and tile only inside wet rooms.
    box(7, -.06, 1.5, 14, .12, 9, floorMat);
    box(1.6, -.025, -1.5, 3.2, .10, 3, tileMat);

    // Apartment shell relevant to the official Type 106 route.
    wallX(0,14,-3); wallX(0,14,6); wallZ(0,-3,6); wallZ(14,-3,6);

    // West entry Hall and wet-room partitions.
    wallZ(1.05,-3,-.15);                  // Laundry / Hall divider
    wallZ(3.25,-3,-.15);                  // Bath east wall
    wallZ(5.15,-3,0);                     // Ensuite/private wet block east return
    wallX(0, .18, 0);                     // Laundry south wall segments and door
    wallX(.88, 1.05, 0);
    wallX(1.05, 1.38, 0);                 // Bath south wall segments and main door
    wallX(2.28, 3.25, 0);
    wallX(3.25, 5.15, 0);                 // Private wet block remains solid from this route

    // MPR and Bedroom 2 are real solid volumes south of the west kitchen axis.
    wallX(0,.35,1.85); wallX(1.15,2.55,1.85); // Bedroom 2 north wall with one door
    wallZ(2.55,1.85,6);
    wallX(2.55,4.72,1.85); wallX(5.42,5.65,1.85); // MPR north wall with one door near east end
    wallZ(5.65,1.85,6);

    // Bedroom 1/private block north of the eastern axis; one plan-supported door.
    wallX(10.4,11.12,0); wallX(11.98,14,0);

    // Linear north kitchen, one island, and restrained fixed elements.
    box(7.75,.45,-.38,5.1,.9,.7,cabinetMat);
    box(7.75,1.02,-.39,5.1,.18,.72,stoneMat);
    box(8.25,.48,1.55,3.05,.96,.86,cabinetMat);
    box(8.25,1.02,1.55,3.12,.14,.94,stoneMat);
    box(8.6,1.12,1.55,.46,.05,.38,darkMat);

    // Bath fixtures as orientation anchors, not promotional styling.
    box(2.55,.34,-2.62,1.15,.68,.58,stoneMat); // tub/shower footprint
    box(2.62,.78,-2.78,.72,1.3,.05,glassMat);
    box(1.42,.45,-2.62,.62,.9,.55,cabinetMat); // vanity
    box(2.52,.42,-1.22,.46,.84,.56,wallMat);   // WC block

    // Simple public-zone markers; kept low so route remains readable.
    box(9.1,.38,3.1,1.5,.1,.85,stoneMat);      // dining table
    box(11.7,.42,3.55,2.2,.78,.9,wallMat);     // living sofa
    box(13.86,1.25,3,.05,2.25,5.1,glassMat);   // terrace glazing

    scene.add(new THREE.HemisphereLight(0xffffff,0x8f8578,1.35));
    const sun=new THREE.DirectionalLight(0xffffff,1.45); sun.position.set(10,12,8); sun.castShadow=true; scene.add(sun);

    const poses={
      B0:{p:[11.45,1.60,.56], t:[8.8,1.48,.54], label:'B0  Living/Dining hub - face west'},
      B1:{p:[10.0,1.60,.56], t:[7.2,1.48,.54], label:'B1  Clear the single island'},
      B2:{p:[6.0,1.60,.56], t:[3.3,1.48,.54], label:'B2  West kitchen axis - MPR stays left'},
      B3:{p:[3.0,1.60,1.50], t:[1.82,1.42,-.12], label:'B3  Wet-area junction - Bath doorway visible'},
      B4:{p:[1.82,1.60,.90], t:[1.92,1.25,-2.15], label:'B4  Camera aligned between fixed Bath jambs'},
      B5:{p:[1.82,1.60,-.70], t:[2.08,1.18,-2.48], label:'B5  Camera fully inside the Bath'}
    };
    const params=new URLSearchParams(location.search); const id=params.get('pose')||'B0'; const pose=poses[id]||poses.B0;
    document.querySelector('#tag').textContent=pose.label;
    const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.05,50);
    camera.position.fromArray(pose.p); camera.lookAt(...pose.t);

    renderer.render(scene,camera);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(scene,camera)});
  </script>
</body>
</html>
