<svg xmlns="http://www.w3.org/2000/svg" width="2934" height="1800" viewBox="0 0 2934 1800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0877ff"/>
    </marker>
    <marker id="look-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e14b91"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.45"/>
    </filter>
  </defs>
  <image href="../../route-audit-v2/apartment-106-plan-untouched-crop.png" x="0" y="0" width="2934" height="1800"/>

  <!-- Corrected camera translation: starts at the Living/Dining hub, never approaches or enters MPR. -->
  <path d="M 1600 1190
           C 1710 1150, 1800 1115, 1900 1110
           C 2050 1105, 2180 1135, 2250 1210
           C 2310 1270, 2335 1325, 2400 1355
           C 2470 1385, 2535 1390, 2610 1390"
        fill="none" stroke="#0877ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" filter="url(#shadow)"/>

  <!-- MPR is a look direction from the public hub, not a destination. -->
  <path d="M 1600 1190 C 1440 1135, 1265 1070, 1080 1015"
        fill="none" stroke="#e14b91" stroke-width="15" stroke-dasharray="24 18" stroke-linecap="round" marker-end="url(#look-arrow)" filter="url(#shadow)"/>

  <g font-family="Verdana" font-size="30" font-weight="700" text-anchor="middle">
    <g><circle cx="1600" cy="1190" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="1600" y="1201" fill="#0877ff">P0</text></g>
    <g><circle cx="1900" cy="1110" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="1900" y="1121" fill="#0877ff">P1</text></g>
    <g><circle cx="2250" cy="1210" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2250" y="1221" fill="#0877ff">P2</text></g>
    <g><circle cx="2400" cy="1355" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2400" y="1366" fill="#0877ff">P3</text></g>
    <g><circle cx="2610" cy="1390" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2610" y="1401" fill="#0877ff">P4</text></g>
  </g>

  <g font-family="Verdana" fill="#ffffff" filter="url(#shadow)">
    <rect x="92" y="1510" width="1820" height="205" rx="28" fill="#14202e" fill-opacity="0.94"/>
    <text x="145" y="1574" font-size="40" font-weight="700">8s ROUTE V2 - HUB START, MPR DOOR GLANCE, TERRACE</text>
    <text x="145" y="1632" font-size="29">Blue = camera travel. Pink dashed = look direction only; the camera stays in the public hub.</text>
    <text x="145" y="1680" font-size="29">The opening image is Living/Dining, then a shallow Living arc and the existing east terrace exit.</text>
  </g>
</svg>
