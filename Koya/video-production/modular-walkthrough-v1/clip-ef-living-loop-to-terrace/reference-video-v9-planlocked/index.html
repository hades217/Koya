<!DOCTYPE html>

  <body>
    <div data-hf-id="hf-m2ef" id="root" data-composition-id="main" data-no-timeline="" data-duration="8" data-width="1920" data-height="1080">
      <div data-hf-id="hf-0kyv" id="scene" class="clip" data-start="0" data-duration="8" data-track-index="1">

    <script type="module">
      import * as THREE from "./node_modules/three/build/three.module.js";

      const canvas = document.getElementById("world");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1920, 1080, false);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd9e5e7);
      scene.fog = new THREE.Fog(0xd9e5e7, 24, 50);

      // A moderate rectilinear lens. The room scale is carried by geometry and translation,
      // not by an extreme wide-angle lens.
      const camera = new THREE.PerspectiveCamera(55, 1920 / 1080, 0.06, 70);
      camera.up.set(0, 1, 0);

      scene.add(new THREE.HemisphereLight(0xeaf4f6, 0x806c59, 2.4));

      sun.position.set(-5, 12, 9);

      sun.shadow.mapSize.set(2048, 2048);

      sun.shadow.camera.right = 20;
      sun.shadow.camera.top = 16;
      sun.shadow.camera.bottom = -16;
      scene.add(sun);

      let seed = 1060901;
      const random = () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
      const noiseTexture = (base, fleck, repeatX=3, repeatY=3, count=3600) => {
        const c = document.createElement("canvas"); c.width = c.height = 256;
        const g = c.getContext("2d"); g.fillStyle = base; g.fillRect(0,0,256,256);
        g.fillStyle = fleck;
        for (let i=0; i<count; i++) { g.globalAlpha=.015+random()*.045; g.fillRect(random()*256,random()*256,.3+random()*1.4,.3+random()*1.4); }
        g.globalAlpha=1;
        const t = new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
        t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeatX,repeatY); return t;
      };
      const mat = (color, roughness=.78, metalness=0, map=null) => new THREE.MeshStandardMaterial({color,roughness,metalness,map});
      const wallTex=noiseTexture("#eee9e1","#bdb4a9",3,3,4800);
      const oakTex=noiseTexture("#bd956d","#735038",7,1,2800);

      const world = new THREE.Group(); scene.add(world);
      const box=(name,x,y,z,w,h,d,material,parent=world)=>{

      const cylinder=(name,x,y,z,r,h,material,parent=world,segments=24)=>{

      // Plan-locked public envelope: 15 x 6.8 normalized units (2.21:1).

      for(let z=.12; z<6.72; z+=.20) box("oak-joint",7.5,.004,z,14.96,.009,.012,oak);

      box("mpr-north-wall",1.48,1.36,2.05,2.88,2.72,.10,warmWall);
      box("mpr-east-return",2.96,1.36,2.45,.12,2.72,.80,warmWall);

      box("mpr-opening-south-jamb",2.96,1.36,6.28,.12,2.72,.10,warmWall);
      const curvePath=new THREE.QuadraticBezierCurve3(new THREE.Vector3(2.96,2.22,2.84),new THREE.Vector3(2.96,2.64,2.84),new THREE.Vector3(2.96,2.64,3.26));
      const curve=new THREE.Mesh(new THREE.TubeGeometry(curvePath,20,.065,10,false),warmWall); curve.name="mpr-rounded-return"; world.add(curve);
      box("mpr-rug",1.38,.02,4.65,1.72,.035,1.42,mat(0xaaa095,.98));

        const chair=new THREE.Group(); chair.position.set(x,0,z); chair.rotation.y=yaw; world.add(chair);

      // Solid north TV wall below Bedroom 1. The wall ends before the east glazing.
      box("living-tv-wall",11.15,1.38,1.50,7.18,2.76,.14,warmWall);
      box("tv-console",11.45,.33,1.70,2.20,.54,.42,oak);

      box("sofa-base",0,.26,0,3.00,.46,.78,linen,sofa);

      for(const x of[-.98,0,.98]) box("sofa-cushion",x,.56,-.04,.82,.19,.54,linen,sofa);

      box("cocoa-cushion",.78,.84,.16,.48,.42,.14,cocoa,sofa);
      box("living-rug",11.20,.018,4.02,5.42,.035,2.30,mat(0xbdb5aa,.98));
      box("coffee-table",10.82,.31,3.78,1.34,.10,.72,stone);

      box("south-head",9.00,2.65,6.79,12.00,.10,.14,black);
      box("south-track",9.00,.06,6.79,12.00,.08,.14,black);
      const southFrames=[3.00,4.00,5.00,6.00,7.00,8.00,9.00,10.00,11.00,12.00,13.00,14.00,15.00];
      for(const x of southFrames) box("south-frame",x,1.38,6.79,.055,2.62,.10,black);

      box("south-balustrade-glass",10.30,.64,9.76,12.78,.82,.025,glass);
      for(const z of[2.10,3.30,4.50,5.70,6.75]) { cylinder("east-pot",18.05,.20,z,.17,.40,stone); cylinder("east-plant",18.05,.49,z,.23,.24,green); }
      for(const x of[5.0,6.6,8.2,9.8,11.4,13.0,14.6,16.2]) { cylinder("south-pot",x,.20,9.30,.17,.40,stone); cylinder("south-plant",x,.49,9.30,.23,.24,green); }

      // Ceiling details clarify the full room span rather than visually lowering the ceiling.
      box("air-slot",6.10,2.715,1.12,5.10,.018,.10,black);
      for(const [x,z] of [[3.5,3.0],[5.2,3.0],[7.0,3.0],[8.8,3.0],[10.7,3.0],[12.7,3.0],[14.1,3.0],[3.8,5.6],[6.2,5.6],[8.6,5.6],[11.0,5.6],[13.5,5.6]]) {
        cylinder("downlight",x,2.71,z,.045,.018,mat(0xfff1d4,.3),world,20);
        const light=new THREE.PointLight(0xffe7c6,.13,3.5,2); light.position.set(x,2.62,z); world.add(light);
      }

      // Abstract suburban depth only; no claimed project outlook.
      const treeGeometry=new THREE.DodecahedronGeometry(.58,1);
      for(let i=0;i<22;i++) {
        const tree=new THREE.Mesh(treeGeometry,mat(i%2?0x52764b:0x6d8a62,.98));
        tree.position.set(21+(i%5)*1.7,.8+(i%3)*.18,-1+(i*1.64)%12);
        tree.scale.set(1+(i%3)*.16,.9+(i%4)*.11,1+(i%2)*.18); scene.add(tree);
      }

      const eyeKeys=[
        {t:0.00,v:[7.55,1.55,5.92]},
        {t:0.80,v:[7.30,1.55,5.72]},
        {t:1.60,v:[7.20,1.55,6.08]},
        {t:2.40,v:[8.70,1.55,4.72]},
        {t:3.20,v:[10.20,1.55,3.72]},
        {t:4.00,v:[12.10,1.55,3.52]},
        {t:4.80,v:[15.20,1.55,4.15]},
        {t:5.25,v:[16.05,1.55,4.55]},
        {t:5.80,v:[16.55,1.55,4.92]},
        {t:6.35,v:[16.78,1.55,4.82]},
        {t:8.00,v:[16.72,1.55,4.62]}
      ];
      const targetKeys=[
        {t:0.00,v:[1.30,1.18,4.65]},
        {t:0.80,v:[5.45,1.18,.58]},
        {t:1.60,v:[10.30,1.20,2.55]},
        {t:2.40,v:[12.15,1.12,4.95]},
        {t:3.20,v:[14.90,1.18,4.45]},
        {t:4.00,v:[15.80,1.18,4.35]},
        {t:4.80,v:[17.00,1.16,4.60]},
        {t:5.25,v:[17.10,1.02,7.65]},
        {t:5.80,v:[14.70,1.08,6.35]},
        {t:6.35,v:[10.20,1.16,4.28]},
        {t:8.00,v:[8.85,1.18,4.05]}
      ];
      const lerp=(a,b,u)=>a+(b-a)*u;
      const smooth=u=>u*u*(3-2*u);
      const sample=(keys,time,eased=false)=>{
        let i=0; while(i<keys.length-2 && time>keys[i+1].t) i++;
        const a=keys[i],b=keys[i+1],span=Math.max(.001,b.t-a.t);
        let u=Math.max(0,Math.min(1,(time-a.t)/span)); if(eased) u=smooth(u);
        return [lerp(a.v[0],b.v[0],u),lerp(a.v[1],b.v[1],u),lerp(a.v[2],b.v[2],u)];
      };
      function renderAt(time) {
        const eye=sample(eyeKeys,time,false),target=sample(targetKeys,time,true);
        const moving=time>.08 && time<7.35;
        const bob=moving ? .008*Math.sin((time-.08)*Math.PI*3.6) : 0;
        camera.position.set(eye[0],eye[1]+bob,eye[2]);
        camera.lookAt(target[0],target[1]+bob*.25,target[2]);
        renderer.render(scene,camera);
      }
      window.addEventListener("hf-seek",event=>renderAt(event.detail.time));
      renderAt(window.__hfThreeTime || 0);
      window.__koyaV9={scene,camera,renderer,renderAt};
