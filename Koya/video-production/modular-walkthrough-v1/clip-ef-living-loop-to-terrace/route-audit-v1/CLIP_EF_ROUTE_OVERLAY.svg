<svg xmlns="http://www.w3.org/2000/svg" width="2934" height="1800" viewBox="0 0 2934 1800">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0877ff"/>
    </marker>
    <marker id="look-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e14b91"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.45"/>
    </filter>
  </defs>
  <image href="../../route-audit-v2/apartment-106-plan-untouched-crop.png" x="0" y="0" width="2934" height="1800"/>

  <!-- Camera translation: stays outside MPR, crosses the public zone, exits through Living east glazing. -->
  <path d="M 1070 1015
           C 1080 1095, 1095 1175, 1160 1215
           C 1235 1250, 1400 1240, 1510 1225
           C 1620 1210, 1735 1180, 1810 1145
           C 1970 1095, 2140 1110, 2225 1205
           C 2280 1265, 2310 1320, 2385 1350
           C 2460 1380, 2525 1390, 2605 1390"
        fill="none" stroke="#0877ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" filter="url(#shadow)"/>

  <!-- MPR is a glance only; this line is viewing direction, not camera travel. -->
  <path d="M 1070 1015 C 1020 1085, 970 1160, 905 1260"
        fill="none" stroke="#e14b91" stroke-width="15" stroke-dasharray="24 18" stroke-linecap="round" marker-end="url(#look-arrow)" filter="url(#shadow)"/>

  <g font-family="Verdana" font-size="30" font-weight="700" text-anchor="middle">
    <g><circle cx="1070" cy="1015" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="1070" y="1026" fill="#0877ff">P0</text></g>
    <g><circle cx="1300" cy="1240" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="1300" y="1251" fill="#0877ff">P1</text></g>
    <g><circle cx="1810" cy="1145" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="1810" y="1156" fill="#0877ff">P2</text></g>
    <g><circle cx="2225" cy="1205" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2225" y="1216" fill="#0877ff">P3</text></g>
    <g><circle cx="2385" cy="1350" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2385" y="1361" fill="#0877ff">P4</text></g>
    <g><circle cx="2605" cy="1390" r="35" fill="#ffffff" stroke="#0877ff" stroke-width="10"/><text x="2605" y="1401" fill="#0877ff">P5</text></g>
  </g>

  <g font-family="Verdana" fill="#ffffff" filter="url(#shadow)">
    <rect x="92" y="1510" width="1660" height="205" rx="28" fill="#14202e" fill-opacity="0.94"/>
    <text x="145" y="1574" font-size="40" font-weight="700">8s ROUTE - MPR GLANCE, LIVING LOOP, TERRACE</text>
    <text x="145" y="1632" font-size="29">Blue = camera travel. Pink dashed = brief glance only; camera never enters MPR.</text>
    <text x="145" y="1680" font-size="29">Exit through the existing Living east glazing and retain the interior connection.</text>
  </g>
</svg>
