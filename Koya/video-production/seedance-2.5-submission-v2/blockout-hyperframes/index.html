    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #d8e5e8;
      }
      .plate {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const shots = [
        ["#plate-01", 0, 1.1, 1.00, 1.16, 0, 34],
        ["#plate-02", 0.92, 1.18, 1.03, 1.17, 0, 28],
        ["#plate-03", 1.92, 1.18, 1.04, 1.18, 0, 22],
        ["#plate-04", 2.92, 1.68, 1.02, 1.08, 0, 8],

        ["#plate-08", 10.92, 1.18, 1.03, 1.11, 0, 0],
        ["#plate-09", 11.92, 2.18, 1.03, 1.08, 0, -6],
        ["#plate-10", 13.92, 1.18, 1.03, 1.12, 0, 0],
        ["#plate-11", 14.92, 2.18, 1.03, 1.14, 0, 0],
        ["#plate-12", 16.92, 2.18, 1.04, 1.14, 0, 0],
        ["#plate-13", 18.92, 3.18, 1.03, 1.13, 0, 0],
        ["#plate-14", 21.92, 8.08, 1.02, 1.11, 0, -8],
      ];

      shots.forEach(([selector, start, duration, fromScale, toScale, fromY, toY], index) => {
        if (index > 0) {
          tl.fromTo(selector, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, start);
        }
        tl.fromTo(
          selector,
          { scale: fromScale, y: fromY },
          { scale: toScale, y: toY, duration, ease: index < 3 ? "power2.in" : "power1.inOut", immediateRender: false },
          start,
        );
      });
      window.__timelines["main"] = tl;
