<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koya 106 客厅环顾至露台 - 渲染分镜 V2</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #f3efe6; }
    main { width: min(1600px, 96vw); margin: 0 auto; padding: 28px 0 56px; }
    header { display: flex; gap: 24px; align-items: end; justify-content: space-between; margin-bottom: 22px; }
    h1 { font-size: clamp(24px, 3vw, 42px); margin: 0 0 8px; }
    p { margin: 0; color: #c9c1b4; line-height: 1.55; }
    .status { padding: 9px 13px; border: 1px solid #6c8f6d; border-radius: 999px; color: #bfe3c0; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    figure { margin: 0; background: #1b1b1b; border: 1px solid #36332f; border-radius: 10px; overflow: hidden; }
    img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
    figcaption { min-height: 76px; padding: 12px 14px 14px; }
    strong { display: block; margin-bottom: 5px; color: #fff; }
    small { display: block; color: #aaa196; line-height: 1.45; }
    .lock { margin-top: 20px; padding: 18px; border-left: 4px solid #a7865a; background: #1b1916; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Apartment 106 · 客厅环顾 → 东侧露台</h1>
      <p>渲染级分镜 V2 · 同一固定空间 · Concept Design / Artist Impression</p>
    </div>
    <div class="status" style="border-color:#a94b45;color:#ffb0aa">已作废 · 禁止作为视频输入</div>
  </header>
  <section class="grid">
    <figure><img src="rendered-frame-00.png" alt="Frame 01"><figcaption><strong>01 · 进入公共空间</strong><small>单一厨房岛台；远处客厅；南、东两面玻璃同时建立。</small></figcaption></figure>
    <figure><img src="rendered-frame-01.png" alt="Frame 02"><figcaption><strong>02 · 餐区与北侧电视墙</strong><small>餐桌居中；电视柜位于 Bedroom 1 南侧内墙，不占用外立面。</small></figcaption></figure>
    <figure><img src="rendered-frame-02.png" alt="Frame 03"><figcaption><strong>03 · 回看玻璃与厨房</strong><small>南侧连续落地玻璃；厨房仍在北侧，空间没有镜像。</small></figcaption></figure>
    <figure><img src="rendered-frame-03.png" alt="Frame 04"><figcaption><strong>04 · 厨房全貌</strong><small>固定橱柜与唯一岛台；不新增第二套厨房设施。</small></figcaption></figure>
    <figure><img src="rendered-frame-04.png" alt="Frame 05"><figcaption><strong>05 · 单岛台确认</strong><small>同一岛台近景，保持与官方材质图一致的浅石材和木饰面。</small></figcaption></figure>
    <figure><img src="rendered-frame-05.png" alt="Frame 06"><figcaption><strong>06 · 转回客厅出口</strong><small>北侧电视墙、右侧沙发边缘与东侧开放玻璃门形成真实通道。</small></figcaption></figure>
    <figure><img src="rendered-frame-06.png" alt="Frame 07"><figcaption><strong>07 · 距门约 2.5 米</strong><small>开放门扇正前方；沙发在右、电视柜在左，家具不移动。</small></figcaption></figure>
    <figure><img src="rendered-frame-07.png" alt="Frame 08"><figcaption><strong>08 · 靠近东侧门</strong><small>同一开口自然放大，叠放玻璃门扇与深色框仍在原轨道。</small></figcaption></figure>
    <figure><img src="rendered-frame-08.png" alt="Frame 09"><figcaption><strong>09 · 跨越门槛</strong><small>近景可见门框和轨道；室内木地板连接露台砖与同一花槽。</small></figcaption></figure>
  </section>
  <section class="lock">
    <strong>作废原因</strong>
    <p>本版漏掉真实 MPR 右下开口，镜头方向发生跳转，不能构成可执行的物理路线。全部画面仅保留为失败记录，不得直接替代确定性参考视频，也不授权任何 Seedance 付费任务。</p>
  </section>
</main>
</body>
</html>
