<body><main><header><div><h1>Apartment 106 · 完整渲染分镜 V6</h1><p>MPR 快速扫视 → 客餐厨环顾 → 穿过东侧玻璃门 → 露台回望 · 8 秒 · 第一视角</p></div><div class="status">14 张已完成 · 待用户确认</div></header>
<section class="grid">
<figure><img src="01-mpr-opening-render.png"><figcaption><strong>01 · 0.00 s · MPR 开口</strong><small>宽幅开口；无柱子、弧墙或玻璃走廊。</small></figcaption></figure>
<figure><img src="02-leave-mpr-glance-render.png"><figcaption><strong>02 · 0.55 s · 离开 MPR 视线</strong><small>紧凑四人方桌进入画面，摄影机继续前进。</small></figcaption></figure>
<figure><img src="03-dining-to-kitchen-render.png"><figcaption><strong>03 · 1.25 s · 餐区到厨房</strong><small>方桌、玻璃面和唯一中岛共同建立空间关系。</small></figcaption></figure>
<figure><img src="04-kitchen-wide-render.png"><figcaption><strong>04 · 1.65 s · 厨房宽景</strong><small>单一中岛和固定橱柜线。</small></figcaption></figure>
<figure><img src="05-single-island-render.png"><figcaption><strong>05 · 2.15 s · 中岛确认</strong><small>三把吧椅；没有第二个岛台。</small></figcaption></figure>
<figure><img src="06-tv-wall-render.png"><figcaption><strong>06 · 2.95 s · 电视墙</strong><small>内墙电视柜、沙发与外侧玻璃处在同一客厅。</small></figcaption></figure>
<figure><img src="07-sofa-glazing-render.png"><figcaption><strong>07 · 3.35 s · 沙发与玻璃</strong><small>保留客厅景深和露台方向。</small></figcaption></figure>
<figure><img src="08-wrap-glazing-render.png"><figcaption><strong>08 · 4.30 s · 转角玻璃</strong><small>南、东两面玻璃连续转角；东侧通道明确打开。</small></figcaption></figure>
<figure><img src="09-align-opening-render.png"><figcaption><strong>09 · 5.35 s · 对准开口</strong><small>仍在室内，对准同一东侧玻璃门开口。</small></figcaption></figure>
<figure><img src="10-approach-opening-render.png"><figcaption><strong>10 · 5.85 s · 接近门槛</strong><small>门框和轨道因真实前进产生尺度变化。</small></figcaption></figure>
<figure><img src="11-threshold-render.png"><figcaption><strong>11 · 6.35 s · 门槛</strong><small>木地板、黑色轨道、露台砖次序清楚。</small></figcaption></figure>
<figure><img src="12-cross-track-render.png"><figcaption><strong>12 · 6.72 s · 跨轨道</strong><small>门框贴近镜头产生视差，没有穿玻璃。</small></figcaption></figure>
<figure><img src="13-terrace-arrival-render.png"><figcaption><strong>13 · 7.15 s · 到达露台</strong><small>摄影机已经在室外，开口仍保留在画面边缘。</small></figcaption></figure>
<figure><img src="14-terrace-settle-render.png"><figcaption><strong>14 · 7.95 s · 露台回望</strong><small>通过同一开口回看客厅、餐区与厨房，确认来路。</small></figcaption></figure>
